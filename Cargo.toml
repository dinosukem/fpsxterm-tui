[package]
name = "fpsxterm-tui"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
bytes = "1.11.0"
crossterm = { version = "0.29.0", features = ["event-stream"] }
directories = "6.0.0"
futures-util = "0.3.31"
glob = "0.3.3"
openssh = "0.11.6"
openssh-sftp-client = { version = "0.15.12", features = ["openssh"] }
portable-pty = "0.9.0"
ratatui = { version = "0.30.2", features = ["crossterm_0_29"] }
serde = { version = "1.0.228", features = ["derive"] }
shell-words = "1.1.0"
tempfile = "3.23.0"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["full"] }
toml = "0.9.8"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }
tui-term = "0.3.4"
vt100 = "0.16.2"
